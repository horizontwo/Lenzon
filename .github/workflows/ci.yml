name: CI

# Runs on the `explainer-format` branch of horizontwo/lenzon, where this
# folder is the repo root. In Lenzon-Platform this file sits at
# packages/explainer-format/.github and GitHub ignores it.
#
# It checks. It does not publish. Releases publish from Lenzon-Platform.

on:
  pull_request:
  push:
    branches: [explainer-format]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
