name: CI

# Runs on the `player` branch of horizontwo/lenzon, where this folder is the
# repo root. In Lenzon-Platform this file sits at apps/player/.github and
# GitHub ignores it.
#
# It checks. It does not publish. Releases publish from Lenzon-Platform.

on:
  pull_request:
  push:
    branches: [player]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No lock file on this branch. @lenzon/explainer-format comes from npm
      # at the exact version package.json pins.
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
